      "high": 0.39,
      "source": {
        "label": "Couch, Electricity use of AI coding agents (Jan 2026)",
        "url": "https://simonpcouch.com/blog/2026-01-20-cc-impact/",
        "note": "Per-token-class energy back-solved from Epoch AI's GPT-4o estimates, in three context cases: typical short (input ~110 / output ~540 Wh/MTok), medium context ~10k tokens (~200 / ~990), maximum context ~100k tokens (~390 / ~1,950). Couch used the ~100k case for coding agents, which run long contexts; it is the central here and the ~10k case the low end. The short-query case is not used: it does not describe a coding-agent session, which sends ~20k tokens of system prompt and tools before the first message. Couch calls it napkin math."
      },
      "rangeSource": {
        "label": "Epoch AI, How much energy does ChatGPT use? (Feb 2025)",
        "url": "https://epoch.ai/gradient-updates/how-much-energy-does-chatgpt-use",
        "note": "GPT-4o: ~0.3 Wh per typical query, ~2.5 Wh with a 10k-token input, ~40 Wh with 100k. The basis of Couch's rates."
      }
    },
