name: Release preparation

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-preparation
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'braydenyancy/centrail-calculations' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: write
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      # Built-in-token PR creation also suppresses pull_request-triggered checks.
      - name: Start checks for the generated release PR
        if: steps.release.outputs.prs_created == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        env:
          RELEASE_PRS: ${{ steps.release.outputs.prs }}
        with:
          script: |
            const prs = JSON.parse(process.env.RELEASE_PRS);
            if (prs.length !== 1) throw new Error('Expected one package release PR');
            const { data: pr } = await github.rest.pulls.get({ ...context.repo, pull_number: prs[0].number });
            if (pr.base.ref !== 'main' || pr.head.repo.full_name !== `${context.repo.owner}/${context.repo.repo}` || !pr.head.ref.startsWith('release-please--branches--main')) throw new Error('Unexpected release PR branch');
            for (const workflow_id of ['ci.yml', 'codeql.yml']) {
              await github.rest.actions.createWorkflowDispatch({ ...context.repo, workflow_id, ref: pr.head.ref });
            }
      # GITHUB_TOKEN-created tags do not trigger tag push workflows. Dispatch at
      # that immutable tag, keeping publication out of branch-context runs.
      - name: Start publication for the created version tag
        if: steps.release.outputs.release_created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.release.outputs.tag_name }}
        run: gh workflow run publish.yml --ref "$RELEASE_TAG"
