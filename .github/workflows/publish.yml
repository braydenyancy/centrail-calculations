name: Publish

on:
  push:
    tags: ['v*']
  # Release preparation dispatches at its created tag; this also permits retrying
  # an existing reviewed tag without moving it. Dispatch from a branch is refused.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  verify:
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    uses: ./.github/workflows/ci.yml

  package:
    name: Prepare tested package
    needs: verify
    if: github.repository == 'braydenyancy/centrail-calculations' && github.ref_type == 'tag' && vars.NPM_PUBLISH_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      dist-tag: ${{ steps.version.outputs.dist-tag }}
      publish-needed: ${{ steps.registry.outputs.publish-needed }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: Require a reviewed commit on main
        run: git merge-base --is-ancestor HEAD origin/main
      - name: Require the release tag to match the package version
        id: version
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync, readFileSync } from 'node:fs';
          const { name, version } = JSON.parse(readFileSync('package.json', 'utf8'));
          const manifest = JSON.parse(readFileSync('.release-please-manifest.json', 'utf8'));
          if (process.env.GITHUB_REF_TYPE !== 'tag' || name !== '@centrail/calculations'
              || process.env.GITHUB_REF_NAME !== `v${version}` || manifest['.'] !== version) {
            throw new Error('The release tag must match @centrail/calculations package.json version');
          }
          appendFileSync(process.env.GITHUB_OUTPUT, `dist-tag=${version.includes('-') ? 'next' : 'latest'}\n`);
          NODE
      - run: npm ci --ignore-scripts
      - run: npm run check
      - name: Retain the exact tarball tested by isolated consumers
        run: npm run test:package -- --out artifacts
      - name: Check immutable registry version before publication
        id: registry
        run: node scripts/release-registry.mjs preflight artifacts/pack-report.json
      - name: Retain the registry verifier for the read-only post-publication job
        run: cp scripts/release-registry.mjs artifacts/release-registry.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-package
          path: |
            artifacts/*.tgz
            artifacts/pack-report.json
            artifacts/release-registry.mjs
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish tested package
    needs: package
    if: needs.package.outputs.publish-needed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: npm-package
          path: artifacts
      - name: Verify the tested tarball and an OIDC-capable npm version
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, readdirSync } from 'node:fs';
          import { createHash } from 'node:crypto';
          import { execFileSync } from 'node:child_process';
          const tarballs = readdirSync('artifacts').filter(name => name.endsWith('.tgz'));
          if (tarballs.length !== 1) {
            throw new Error('Expected exactly one tested package tarball');
          }
          const report = JSON.parse(readFileSync('artifacts/pack-report.json', 'utf8'));
          const sha256 = createHash('sha256').update(readFileSync(`artifacts/${tarballs[0]}`)).digest('hex');
          if (report.name !== '@centrail/calculations' || report.filename !== tarballs[0]
              || process.env.GITHUB_REF_NAME !== `v${report.version}` || report.sha256 !== sha256) {
            throw new Error('The package tarball must match its tested release receipt');
          }
          const [major, minor, patch] = execFileSync('npm', ['--version'], { encoding: 'utf8' }).trim().split('.').map(Number);
          if (![major, minor, patch].every(Number.isSafeInteger)
              || major < 11 || (major === 11 && (minor < 5 || (minor === 5 && patch < 1)))) {
            throw new Error('npm >=11.5.1 is required for trusted publishing');
          }
          NODE
      - name: Publish with npm trusted publishing
        env:
          NPM_DIST_TAG: ${{ needs.package.outputs.dist-tag }}
        run: npm publish artifacts/*.tgz --access public --provenance --ignore-scripts --tag "$NPM_DIST_TAG"

  published:
    name: Verify published bytes
    needs: [package, publish]
    if: always() && needs.package.result == 'success' && (needs.publish.result == 'success' || needs.publish.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          package-manager-cache: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: npm-package
          path: artifacts
      - run: node artifacts/release-registry.mjs verify artifacts/pack-report.json
